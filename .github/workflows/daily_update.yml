name: Actualización Diaria del Observatorio

on:
  schedule:
    # 7:00 AM Hora de Perú (12:00 UTC) - Portadas del Día
    - cron: '0 12 * * *'
    # 8:30 AM Hora de Perú (13:30 UTC) - Antes del turno de Chabely (9:00 AM)
    - cron: '30 13 * * *'
    # 11:00 AM Hora de Perú (16:00 UTC) - Mitad de jornada
    - cron: '0 16 * * *'
    # 1:30 PM Hora de Perú (18:30 UTC) - Cierre de turno de Chabely (2:00 PM)
    - cron: '30 18 * * *'
  workflow_dispatch: # Botón manual en GitHub Actions para actualizar cuando desees

permissions:
  contents: write

jobs:
  update-media:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          pip install python-dateutil

      - name: Ejecutar Web Scraping Automático de Medios
        run: |
          python scripts/fetch_media.py

      - name: Confirmar y Guardar Cambios en GitHub
        run: |
          git config --global user.name "Observatorio Chabely Bot"
          git config --global user.email "actions@github.com"
          git add data/ images/today/
          if git diff --staged --quiet; then
            echo "No hay noticias nuevas en este ciclo."
          else
            git commit -m "[Auto] Scraping de medios y fotos del día $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
