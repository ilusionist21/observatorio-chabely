name: Actualización Diaria del Observatorio

on:
  schedule:
    # 6:00 AM Hora de Perú (UTC-5) -> 11:00 UTC
    - cron: '0 11 * * *'
    # 1:00 PM Hora de Perú (UTC-5) -> 18:00 UTC
    - cron: '0 18 * * *'
  workflow_dispatch: # Permite ejecutar manualmente cuando quieras con 1 clic

permissions:
  contents: write

jobs:
  update-media:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ejecutar Extractor de Medios (Puno, Nacional, Internacional)
        run: |
          python scripts/fetch_media.py

      - name: Confirmar y Guardar Cambios en GitHub
        run: |
          git config --global user.name "Observatorio Chabely Bot"
          git config --global user.email "actions@github.com"
          git add data/ images/today/
          if git diff --staged --quiet; then
            echo "No hay cambios nuevos para guardar hoy."
          else
            git commit -m "[Auto] Actualización de medios y fotos del día $(date +'%Y-%m-%d')"
            git push
          fi
